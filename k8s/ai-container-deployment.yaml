apiVersion: apps/v1
kind: Deployment
metadata:
  name: aicontainer-deployment
spec:
  replicas: 1

  selector:
    matchLabels:
      app: ai-fastapi

  template:
    metadata:
      labels:
        app: ai-fastapi

    spec:
      containers:
      - name: ai-fastapi-container
        image: ai-container-test:v2
        imagePullPolicy: Never

        ports:
        - containerPort: 8000     